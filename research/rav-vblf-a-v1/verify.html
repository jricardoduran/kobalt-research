<!doctype html><meta charset="utf-8"><title>RAV verify</title><pre id="out">RUNNING</pre><script type="module">import{RAV}from'./rav.js';const v=await fetch('./test-vectors.json').then(r=>r.json());try{for(const x of v.vectors){const e=await RAV.encode(x.slot,RAV.utf8(x.payload));if(RAV.hex(e.bytes)!==x.hex||e.rid!==x.rid||e.hash!==x.hash)throw Error('encode vector '+x.slot);const d=await RAV.decode(RAV.unhex(x.hex));if(d.slot!==x.slot||RAV.text(d.payload)!==x.payload)throw Error('decode vector '+x.slot);}document.title='PASS';out.textContent='PASS '+v.vectors.length+' vectores';}catch(e){document.title='FAIL';out.textContent=e.stack}</script>
